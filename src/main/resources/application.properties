spring.application.name=splitbill
server.port=4110

# JSON in/out uses snake_case (paid_by, split_type, ...), enums accept "equal" or "EQUAL"
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.accept-case-insensitive-enums=true

# Where groups are stored (plain JSON file, no database)
app.data-file=data/groups.json